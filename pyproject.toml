[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-audit"
version = "0.1.0"
description = "Lightweight Markdown Writing Quality Auditor POC"
authors = [{ name = "Quality Engineering Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
md-audit = "md_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
